name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Type check
        run: mypy

      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest --cov --cov-report=term --cov-report=xml

      - name: Vulnerability check (runtime dependencies)
        run: pip-audit --requirement requirements.txt --strict

  build:
    name: Build and smoke-test the packaged app
    runs-on: windows-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and
              -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }

      - name: Build
        run: python build/build.py

      - name: Smoke test (fresh data folder, packaged executable)
        shell: pwsh
        run: ./build/smoke_test.ps1 -Exe dist/DesktopOrganizer/DesktopOrganizer.exe

      - name: Smoke test (system-wide install, Start menu, uninstall)
        shell: pwsh
        run: ./build/smoke_test_installer.ps1 -Setup (Get-ChildItem dist/*-setup.exe).FullName

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-organizer-build
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/SHA256SUMS.txt
          retention-days: 14
